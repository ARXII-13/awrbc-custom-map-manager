name: release

# Builds the desktop app and attaches it to a GitHub release.
#
#     git tag v0.1.0-rc.1 && git push origin v0.1.0-rc.1
#
# A tag with a hyphen in it (-rc.1, -beta.2) is published as a prerelease -
# the semver convention, read here so that marking one is not a thing to
# remember at the wrong moment.
#
# The build runs on a real Windows runner because PyInstaller bundles a
# runtime for the platform it runs on; a Linux runner cannot make a Windows
# app. macOS and Linux still install with pip, so nothing is built for them
# yet - see awrbc/desktop/README.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: pip install -e ".[dev,package]"

      # A release that fails its own tests is not a release. This is the same
      # suite tests.yml runs; it is repeated here because a tag can point at
      # any commit, including one that never went through a push to main.
      - name: Run the suite
        run: python -m unittest discover -s . -t . -q

      # build_desktop.py runs `awrbc --check` against what it just built, so a
      # bundle that cannot import itself or find its own editor fails here
      # rather than in somebody's download.
      - name: Build the desktop app
        run: python tools/build_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: awrbc-windows
          path: dist/awrbc-windows.zip
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: awrbc-windows
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The tag has to agree with the version in pyproject.toml, and whether
      # this is a prerelease is read from the version rather than matched as
      # a string. `packaging` normalises a semver tag into PEP 440 - 0.1.0-rc.1
      # and 0.1.0rc1 are the same version - so the two spellings can be
      # compared instead of kept in step by hand.
      - name: Check the tag against the package version
        id: kind
        shell: bash
        run: |
          pip install -q packaging
          python - "${{ github.event.inputs.tag || github.ref_name }}" <<'PY'
          import os, sys, tomllib
          from packaging.version import InvalidVersion, Version

          tag = sys.argv[1]
          try:
              tagged = Version(tag.lstrip("v"))
          except InvalidVersion:
              sys.exit("::error::%r is not a version this can publish" % tag)

          with open("pyproject.toml", "rb") as fh:
              declared = Version(tomllib.load(fh)["project"]["version"])

          if tagged != declared:
              sys.exit("::error::tag %s is version %s, but pyproject.toml "
                       "says %s. One of them is wrong." % (tag, tagged, declared))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("tag=%s\n" % tag)
              out.write("prerelease=%s\n" % str(tagged.is_prerelease).lower())
          print("publishing %s (prerelease=%s)" % (tag, tagged.is_prerelease))
          PY

      # `gh` rather than a third-party action, which is the same judgement
      # github.ts makes about the SDK: this job holds a token that can write
      # to the repository, and the CLI is already on the runner.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -s dist/awrbc-windows.zip || {
            echo "::error::no zip to publish"; exit 1; }

          flag=""
          if [ "${{ steps.kind.outputs.prerelease }}" = "true" ]; then
            flag="--prerelease"
          fi

          gh release create "${{ steps.kind.outputs.tag }}" \
            --title "${{ steps.kind.outputs.tag }}" \
            --notes-file .github/release-notes.md \
            $flag \
            dist/awrbc-windows.zip
