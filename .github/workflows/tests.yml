name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows is what ships first, but the suite runs on all three from the
    # start. The point is not that macOS and Linux are supported yet - they are
    # not packaged - it is that the day they stop working, this says so. Finding
    # two years of drift at once is what makes "support it later" expensive.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.9', '3.13']
        exclude:
          # 3.9 on one platform is enough to hold the floor in requires-python.
          - os: macos-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.9'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # With the extra, so the server tests run rather than skipping. The
      # package itself still declares no dependencies.
      - name: Install
        run: pip install -e ".[server]"

      # No save file and no game: the suite builds its own documents from the
      # type table, which is what lets it run on a clean runner at all.
      - name: Run the suite
        run: python -m unittest discover -s . -t . -v

      # The editor's modules are plain ES modules with no DOM (#48), so node's
      # built-in runner covers them with nothing installed. The editor once ran
      # dead for five commits; this is the half that syntax checking cannot see.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `shell: bash` and an unquoted glob on purpose. Node only learned to
      # expand a glob after --test itself in v21, and the Windows runner's
      # default shell is PowerShell, which does not expand globs for native
      # commands at all. Letting bash do it works on every runner and does not
      # depend on which node is installed.
      - name: Run the editor tests
        shell: bash
        run: node --test web/test/*.test.mjs

      - name: Check the CLI starts
        run: |
          python -m awrbc --help
          python -m awrbc doctor || true   # no save on a runner; must not crash
