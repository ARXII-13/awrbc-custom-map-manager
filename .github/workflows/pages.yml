name: deploy the editor

# Publishes web/ to GitHub Pages. The editor is static with no build step, so
# this is almost entirely "copy the files" - the interesting parts are what it
# refuses to publish and what it writes in on the way.
#
# Enable Pages once in Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        shell: bash
        env:
          # Where the intake server lives. Without it the editor deploys with
          # no Submit button, which is correct: edit-and-export is a complete
          # tool, and a button that cannot work is worse than none.
          INTAKE_URL: ${{ vars.INTAKE_URL }}
        run: |
          mkdir -p site
          cp -r web/* site/

          # Not part of a published site: the dev server, the tests, and the
          # sprite directory's documentation. `sprites/` itself holds no art in
          # git - see the note below.
          rm -rf site/test site/serve.py site/README.md site/sprites

          if [ -n "$INTAKE_URL" ]; then
            python - "$INTAKE_URL" <<'PY'
          import io, sys
          url = sys.argv[1].strip()
          p = 'site/index.html'
          s = io.open(p, encoding='utf-8').read()
          before = s
          s = s.replace('<meta name="awrbc-intake" content="">',
                        '<meta name="awrbc-intake" content="%s">' % url)
          assert s != before, 'the intake meta tag was not found'
          io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print('intake set to', url)
          PY
          else
            echo "::notice title=No intake server::INTAKE_URL is not set, so the editor deploys without a Submit button. Set it under Settings > Secrets and variables > Actions > Variables."
          fi

      # The sprite pack is not in git, on purpose: third-party art stays out
      # of permanent history, where removing it would mean a rewrite rather
      # than a delete. It is served from a release instead, which can be
      # deleted in one click if that ever needs undoing.
      #
      # A missing pack must not fail the deploy. The editor without one renders
      # terrain as letters on flat colour - drab, but a working tool, and far
      # better than no site at all.
      - name: Fetch the sprite pack
        shell: bash
        env:
          TAG: ${{ vars.SPRITE_RELEASE_TAG || 'sprites' }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p site/sprites
          ok=1
          for f in manifest.json units.png terrain.png; do
            if ! curl -fsSL --retry 2 -o "site/sprites/$f" "$base/$f"; then
              echo "::warning title=No sprite pack::Could not fetch $f from release '$TAG'. The editor will render terrain as letters on flat colour."
              ok=0
              break
            fi
          done
          if [ "$ok" = "1" ]; then
            # A manifest that is really an HTML error page would deploy a
            # broken pack rather than no pack, which is worse: the editor
            # would try to use it and draw nothing.
            if python -c "import json; json.load(open('site/sprites/manifest.json', encoding='utf-8'))"; then
              echo "sprite pack in place: $(du -ch site/sprites/* | tail -1 | cut -f1)"
            else
              echo "::warning title=Bad sprite pack::manifest.json from release '$TAG' is not valid JSON; serving without a pack."
              rm -rf site/sprites
            fi
          else
            rm -rf site/sprites
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
