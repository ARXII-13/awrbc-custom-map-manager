name: deploy the editor

# Publishes web/ to GitHub Pages. The editor is static with no build step, so
# this is almost entirely "copy the files" - the interesting parts are what it
# refuses to publish and what it writes in on the way.
#
# Enable Pages once in Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        shell: bash
        env:
          # Where the intake server lives. Without it the editor deploys with
          # no Submit button, which is correct: edit-and-export is a complete
          # tool, and a button that cannot work is worse than none.
          INTAKE_URL: ${{ vars.INTAKE_URL }}
        run: |
          mkdir -p site
          cp -r web/* site/

          # Not part of a published site: the dev server, the tests, and the
          # sprite directory's documentation. The pack itself stays - it is
          # what the editor draws with.
          rm -rf site/test site/serve.py site/README.md
          rm -f site/sprites/README.md site/sprites/manifest.example.json

          if [ -n "$INTAKE_URL" ]; then
            python - "$INTAKE_URL" <<'PY'
          import io, sys
          url = sys.argv[1].strip()
          p = 'site/index.html'
          s = io.open(p, encoding='utf-8').read()
          before = s
          s = s.replace('<meta name="awrbc-intake" content="">',
                        '<meta name="awrbc-intake" content="%s">' % url)
          assert s != before, 'the intake meta tag was not found'
          io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print('intake set to', url)
          PY
          else
            echo "::notice title=No intake server::INTAKE_URL is not set, so the editor deploys without a Submit button. Set it under Settings > Secrets and variables > Actions > Variables."
          fi

      # The pack ships in the repository (decision #56), so there is nothing
      # to fetch - but a deploy that silently lost it would render terrain as
      # letters and look broken rather than fail, so it is checked.
      - name: Check the sprite pack made it
        shell: bash
        run: |
          if python -c "import json; json.load(open('site/sprites/manifest.json', encoding='utf-8'))" 2>/dev/null; then
            echo "sprite pack: $(du -ch site/sprites/* | tail -1 | cut -f1)"
          else
            echo "::warning title=No sprite pack::site/sprites/manifest.json is missing or unreadable; the editor will render terrain as letters on flat colour."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
