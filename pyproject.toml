[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awrbc-custom-map-manager"
version = "0.1.0"
description = "Map editor and archive tooling for Advance Wars 1+2: Re-Boot Camp"
requires-python = ">=3.9"
dependencies = []

# Still dependency-free. The desktop app and its packaging went to
# awrbc-save-editor; nothing here opens a save.
[project.optional-dependencies]
# Reading the committed sprite sheet's pixels, which tests/test_sprite_pack.py
# does and nothing shipped does. Without it those tests skip - which is how
# they managed to never run on CI at all.
dev = ["pillow"]

[project.scripts]
awrbc = "awrbc.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["awrbc*"]
