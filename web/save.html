<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advance Wars 1+2 map tool</title>
<!--
  The save editor's page.

  Deliberately not index.html. That page is the map editor: it carries the
  editing engine, Export bundle, and the path that submits a map to a public
  archive. None of that belongs in a tool somebody downloads to manage their
  own save file, and the first packaged build shipped all of it because it
  loaded that page.

  What is shared is the renderer, and only the renderer. A save manager has to
  show which map is which, and drawing a map is drawing a map.

  Maps come from somewhere else - the hosted editor, a friend, the archive -
  as a .json or an Export bundle .zip, and get imported from a file here.
-->
<style>
  :root {
    --bg: #15171c; --panel: #1c1f26; --line: #2c313b;
    --ink: #e7e9ee; --dim: #9aa3b2; --bad: #e0695f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; }
  main { padding: 18px; max-width: 560px; }
  button, .btn {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  button:hover, .btn:hover { border-color: #3d4452; }
  button:disabled { opacity: .5; cursor: default; }
  .cellbtn { margin-right: 6px; margin-top: 6px; }
  .no { color: var(--bad); }
  #savepanel { margin-top: 10px; }
  .row { display: block; border-top: 1px solid var(--line); padding: 8px 0; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>

<header>
  <h1>Advance Wars 1+2 — save maps</h1>
  <span class="sub" id="packlabel"></span>
</header>

<main>
  <p class="sub">
    Maps in your Ryujinx save. A backup is taken before every write, and
    writing is refused while the game is running.
  </p>

  <label class="btn" title="A map .json, or an Export bundle .zip from the editor">
    Import a map file…
    <input id="mapfile" type="file" accept=".json,.zip" hidden>
  </label>

  <div id="savepanel"></div>
</main>

<script type="module">
import { poster } from "./render.js";
import { loadPack, packLabel } from "./sprites.js";
import { attachIfDesktop } from "./save-ui.js";

const PREVIEW_TILE = 7;

await loadPack();
const name = packLabel();
document.getElementById("packlabel").textContent =
  name ? "sprites: " + name : "no sprite pack - terrain draws as letters";

/**
 * The map the person picked, as a document.
 *
 * A bare .json is the map. A .zip is an Export bundle, whose map.json is the
 * map - unpacked here rather than by reaching for the editor's zip reader,
 * because that reader is for *writing* bundles and lives on the other side of
 * the split.
 */
async function chosen(file) {
  if (!file) return null;
  if (file.name.toLowerCase().endsWith(".zip")) {
    throw new Error(
      "Bundle zips are not readable here yet - open the .zip and import the " +
      "map.json inside it.");
  }
  return JSON.parse(await file.text());
}

let picked = null;
const input = document.getElementById("mapfile");

const panel = attachIfDesktop({
  panel: document.getElementById("savepanel"),
  poster: (doc, tile) => poster(doc, tile || PREVIEW_TILE),
  pickMap: () => picked,
});

input.onchange = async () => {
  const file = input.files && input.files[0];
  input.value = "";                      // so the same file can be picked twice
  try {
    picked = await chosen(file);
  } catch (err) {
    alert(err.message);
    return;
  }
  if (!picked) return;
  const api = await panel;
  if (api && api.addPicked) await api.addPicked();
};
</script>

</body>
</html>
