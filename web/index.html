<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Where the intake server is. Left empty here and filled in when the
     site is deployed; empty means no Submit button, which is the right
     behaviour for a checkout or a deploy without one. -->
<meta name="awrbc-intake" content="">
<title>AWRBC Map Editor</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --ink: #1c1c1e; --muted: #6b6b70;
    --line: #dcdcd8; --accent: #3a6fb8; --sel: #3a6fb8;
    --ok-bg: #d8f0d8; --ok-fg: #1f5f1f; --no-bg: #f6d8d8; --no-fg: #7a2020;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --panel: #1f1f23; --ink: #e8e8ea; --muted: #9a9aa2;
      --line: #32323a; --accent: #6b9de0; --sel: #6b9de0;
      --ok-bg: #1f3f1f; --ok-fg: #9de09d; --no-bg: #4a2020; --no-fg: #f0a0a0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    flex: none; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #body { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas#c { display: block; width: 100%; height: 100%; cursor: crosshair; }
  canvas#c.pan { cursor: grab; }
  canvas#c.panning { cursor: grabbing; }
  aside {
    width: 268px; flex: none; background: var(--panel);
    border-left: 1px solid var(--line); padding: 14px; overflow-y: auto;
  }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 16px 0 6px; font-weight: 600;
  }
  h2:first-child { margin-top: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  button, label.btn, input[type=text] {
    font: inherit; padding: 5px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  input[type=text] { cursor: text; }
  input[type=number] { width: 62px; cursor: text; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .row span { color: var(--muted); font-size: 12px; }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--sel); color: #fff; border-color: var(--sel); }
  button:disabled { opacity: .4; cursor: default; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .cellbtn {
    padding: 0; aspect-ratio: 1; border-radius: 5px; overflow: hidden;
    display: grid; place-items: center; background: transparent;
  }
  .cellbtn canvas { display: block; width: 100%; height: 100%; }
  .cellbtn[aria-pressed="true"] { outline: 2px solid var(--sel); outline-offset: 1px; }
  .teams { display: flex; gap: 4px; flex-wrap: wrap; }
  .teambtn { width: 30px; height: 26px; padding: 0; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 2px 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .swatch {
    width: 11px; height: 11px; border-radius: 2px; display: inline-block;
    margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.25);
  }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .ok { background: var(--ok-bg); color: var(--ok-fg); }
  .no { background: var(--no-bg); color: var(--no-fg); }
  #why { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #tip {
    position: absolute; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
    font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .1s;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
  }
  @media (max-width: 760px) {
    #body { flex-direction: column; }
    aside { width: 100%; border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>
<header>
  <button id="new">New</button>
  <label class="btn" title="A map .json, or an Export bundle .zip">Open<input
    id="file" type="file" accept=".json,.zip" hidden></label>
  <button id="export">Export</button>
  <button id="bundle" title="Map JSON and a preview image, zipped for submitting">Export bundle</button>
  <button id="submit" hidden title="Send this map to the public archive">Submit</button>
  <span id="who" class="sub" hidden></span>
  <button id="signout" hidden title="Forget this sign-in in this browser">Sign out</button>
  <span class="sep"></span>
  <button data-tool="paint" aria-pressed="true" title="Paint terrain (B)">Paint</button>
  <button data-tool="fill" aria-pressed="false" title="Flood fill (G)">Fill</button>
  <button data-tool="unit" aria-pressed="false" title="Place unit (U)">Unit</button>
  <button data-tool="owner" aria-pressed="false" title="Set owner (O)">Owner</button>
  <button data-tool="erase" aria-pressed="false" title="Remove unit (E, or right-click anywhere)">Erase</button>
  <button data-tool="pan" aria-pressed="false" title="Pan (H, or hold Shift)">Pan</button>
  <span class="sep"></span>
  <button id="undo" disabled>Undo</button>
  <button id="redo" disabled>Redo</button>
  <button id="fit">Fit</button>
  <button id="check" hidden>Check</button>
</header>

<div id="body">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="tip"></div>
  </div>
  <aside>
    <h2>Map</h2>
    <input type="text" id="name" style="width:100%" value="Untitled"
           placeholder="map name">
    <input type="text" id="author" style="width:100%;margin-top:6px"
           placeholder="your name">
    <div class="row">
      <input type="number" id="cols" min="1" step="1">
      <span>x</span>
      <input type="number" id="rows" min="1" step="1">
      <button id="resize">Resize</button>
    </div>
    <div class="sub" id="meta" style="margin-top:4px"></div>
    <input type="text" id="tags" style="width:100%;margin-top:6px"
           placeholder="tags, comma separated">
    <div class="sub" id="tagnote"></div>
    <div style="margin-top:6px"><span id="valid"></span></div>
    <div id="why"></div>
    <div class="sub" id="pack" hidden style="margin-top:4px"></div>


    <h2>Army</h2>
    <div class="teams" id="teams"></div>

    <h2>Terrain</h2>
    <div class="grid" id="palette"></div>

    <h2 id="structhead">Structures</h2>
    <div class="grid" id="structures"></div>
    <div id="facingwrap" hidden>
      <div class="sub" style="margin-top:8px">Aims</div>
      <div class="teams" id="facing"></div>
      <div class="sub" style="margin-top:6px">
        Fires at every army, Black Hole included.
      </div>
    </div>

    <h2 id="unithead">Units</h2>
    <div class="grid" id="units"></div>
    <div class="sub" id="unitnote"></div>

    <h2>Armies on the map</h2>
    <table id="stats"><tbody></tbody></table>
  </aside>
</div>

<script type="module">
import { drawMap, fitTile, cellIndex, paletteDirs, poster } from "./render.js";
import { UNITS, TEAMS, TERRAIN_PALETTE, STRUCTURES, NEUTRAL_STRUCTURES,
         DIRECTIONAL, MULTI_TILE, STRUCTURE_SPAN, RUNS, MAX_COLS, MAX_ROWS,
         terrain, team } from "./terrain.js";
import { loadPack, packLabel, spriteFor } from "./sprites.js";
import { createEditor, emptyMap, stats } from "./edit.js";
import { available as repairsFor } from "./fixes.js";
import { zip, mapFromBundle } from "./zip.js";
import { intakeBase } from "./intake.js";
import { attachSubmit } from "./submit-ui.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");

let doc = emptyMap(30, 20);
let ed = null;
let size = 24, ox = 0, oy = 0, cells = new Map();
let logical = { width: 0, height: 0 };
// Until someone zooms or pans, the view is ours to choose, so it re-fits when
// the window changes. After that it is theirs and we leave it alone.
let userFramed = false;
let tool = "paint", brushTerrain = 1, brushUnit = 9, brushTeam = 0;
let brushFacing = "N";

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  logical = { width: r.width, height: r.height };
  if (userFramed) draw(); else fit();
}

function draw() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  drawMap(ctx, doc, {
    size, originX: ox, originY: oy, glyphs: true,
    width: logical.width, height: logical.height,
  });
}

function fit() {
  if (!logical.width || !logical.height) return;
  userFramed = false;
  size = fitTile(doc, logical.width - 24, logical.height - 24);
  ox = Math.floor((logical.width - size * doc.size.cols) / 2);
  oy = Math.floor((logical.height - size * doc.size.rows) / 2);
  draw();
}

/** Everything that has to follow a document change. */
function refresh() {
  cells = cellIndex(doc);
  const s = stats(doc);
  document.getElementById("meta").textContent =
    doc.size.cols + " x " + doc.size.rows + " — " +
    (doc.units || []).length + " units";
  document.getElementById("cols").value = doc.size.cols;
  document.getElementById("rows").value = doc.size.rows;
  document.getElementById("valid").innerHTML =
    '<span class="pill ' + (s.valid ? "ok" : "no") + '">' +
    (s.valid ? "playable" : "not playable") + "</span>";
  document.getElementById("why").textContent =
    (s.valid ? [] : s.reasons).concat(s.notes || []).join("; ");

  const tb = document.querySelector("#stats tbody");
  tb.innerHTML = "";
  for (const n of s.teams) {
    const t = team(n), q = s.perTeam[n];
    tb.insertAdjacentHTML("beforeend",
      '<tr><td><span class="swatch" style="background:' + t.color + '"></span>' +
      t.name + '</td><td class="n">' + q.units + " u</td>" +
      '<td class="n">' + q.properties + " p</td></tr>");
  }
  // Offer the repair pass only when there is something to repair.
  const repairs = repairsFor(doc, { MULTI_TILE, STRUCTURE_SPAN });
  const check = document.getElementById("check");
  check.hidden = repairs.length === 0;
  check.textContent = repairs.length === 1 ? "Fix 1 issue"
                                           : "Fix " + repairs.length + " issues";

  document.getElementById("undo").disabled = !ed.canUndo();
  document.getElementById("redo").disabled = !ed.canRedo();
  draw();
}

function load(json) {
  doc = json;
  ed = createEditor(doc, refresh);
  document.getElementById("name").value = doc.name || "Untitled";
  document.getElementById("tags").value = (doc.tags || []).join(", ");
  // A map that already names an author keeps it - opening someone else's map
  // must not quietly relabel it as yours. A new or anonymous one picks up the
  // name this browser remembers.
  const carried = doc.author && doc.author !== "anonymous" ? doc.author : "";
  doc.author = carried || rememberedAuthor();
  authorBox.value = doc.author;
  buildPalette();
  refresh();
  fit();
}

// --- palette ---------------------------------------------------------------

/**
 * Assemble a sprite at native size, including every tile of a 3x3 structure.
 *
 * A palette entry has to show the whole object. Drawing one cell of a Black
 * Cannon shows a ninth of it, which reads as a grey smudge.
 */
function assemble(kind, id, pick) {
  const first = spriteFor(kind, id, { ...pick, part: "0,0" });
  if (!first) return null;
  const { sw, sh } = first;
  const lift = sh - sw;                     // how far the art overhangs upward

  // Terrain that runs is shown as a short capped length. One tile of pipe
  // fills its own bounds and reads as banding; three read as a pipe.
  if (RUNS.has(id)) {
    const keys = ["E", "E+W", "W"];
    const cv = document.createElement("canvas");
    cv.width = keys.length * sw;
    cv.height = sh;
    const g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;
    keys.forEach((dirs, i) => {
      const sp = spriteFor(kind, id, { ...pick, dirs });
      if (sp) g.drawImage(sp.image, sp.sx, sp.sy, sp.sw, sp.sh, i * sw, 0, sw, sh);
    });
    return cv;
  }

  const span = MULTI_TILE.has(id) ? STRUCTURE_SPAN : 1;
  const cv = document.createElement("canvas");
  cv.width = span * sw;
  cv.height = span * sw + lift;
  const g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  for (let dy = 0; dy < span; dy++) {
    for (let dx = 0; dx < span; dx++) {
      const sp = spriteFor(kind, id, { ...pick, part: dx + "," + dy });
      if (!sp) continue;
      g.drawImage(sp.image, sp.sx, sp.sy, sp.sw, sp.sh,
                  dx * sw, lift + dy * sw + sw - sh, sw, sh);
    }
  }
  return cv;
}

/** The non-empty area of a canvas, so a preview can fill its box. */
function contentBox(cv) {
  const g = cv.getContext("2d");
  const { data } = g.getImageData(0, 0, cv.width, cv.height);
  let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
  for (let y = 0; y < cv.height; y++) {
    for (let x = 0; x < cv.width; x++) {
      if (data[(y * cv.width + x) * 4 + 3] > 8) {
        if (x < x0) x0 = x;
        if (y < y0) y0 = y;
        if (x > x1) x1 = x;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return null;
  return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function swatch(kind, id) {
  const S = 34;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const g = cv.getContext("2d");
  const owner = team(brushTeam);
  const info = kind === "terrain" ? terrain(id) : null;

  g.fillStyle = kind === "unit"
    ? (owner.color)
    : (info.property ? owner.color : (info.base || info.color));
  g.fillRect(0, 0, S, S);

  const pick = kind === "unit"
    ? { team: brushTeam }
    : { team: brushTeam, dirs: paletteDirs(id), variant: 0, facing: brushFacing };
  const art = assemble(kind === "terrain" && info.property ? "property" : kind,
                       id, pick);
  if (art) {
    let box = contentBox(art) || { x: 0, y: 0, w: art.width, h: art.height };
    // Fit the whole thing inside the swatch rather than cropping to the tile,
    // leaving a margin so art that fills its tile does not reach the edge and
    // read as a texture swatch.
    //
    // Except when the art is one tile and stays inside it: then the tile is
    // the thing to show, because fitting to content would scale the art up
    // until it filled the swatch and the swatch would stop matching what the
    // brush paints. Reef is inset inside its tile on purpose, and this is
    // what keeps that true in the palette.
    //
    // One tile means exactly this canvas shape: a tile, plus a tile of
    // overhang space above it. A run of pipe is three tiles wide and a 3x3
    // structure is three of each, so neither is asking the question this
    // answers. Art that does overhang - buildings, mountains - still fits to
    // content, and so do units, where the silhouette is the subject rather
    // than the tile around it.
    const tile = art.width;
    if (kind !== "unit" && art.height === tile * 2 && box.y >= tile) {
      box = { x: 0, y: tile, w: tile, h: tile };
    }
    const pad = 2;
    const scale = Math.min((S - pad * 2) / box.w, (S - pad * 2) / box.h);
    const w = Math.max(1, Math.round(box.w * scale));
    const h = Math.max(1, Math.round(box.h * scale));
    g.imageSmoothingEnabled = false;
    g.drawImage(art, box.x, box.y, box.w, box.h,
                Math.round((S - w) / 2), Math.round((S - h) / 2), w, h);
    return cv;
  }

  // No pack covers this id: the colour, with a letter on it. There is no
  // drawn-art path - a sprite pack is how the palette is meant to look.
  if (kind === "terrain" && info.glyph) {
    g.fillStyle = "rgba(0,0,0,.5)";
    g.font = "bold 17px system-ui, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(info.glyph, S / 2, S / 2);
  }
  return cv;
}

function cellButton(kind, id, label, active, onPick) {
  const b = document.createElement("button");
  b.className = "cellbtn";
  b.title = label;
  b.setAttribute("aria-pressed", String(active));
  b.appendChild(swatch(kind, id));
  b.onclick = onPick;
  return b;
}

function buildPalette() {
  const neutral = brushTeam < 0;

  // Ground: no owner, so the army picker plays no part here.
  const pal = document.getElementById("palette");
  pal.innerHTML = "";
  for (const id of TERRAIN_PALETTE) {
    pal.appendChild(cellButton("terrain", id, terrain(id).name,
      id === brushTerrain && tool !== "unit",
      () => { brushTerrain = id; setTool("paint"); }));
  }

  // Structures: every army can hold these, and neutral additionally gets the
  // ones that are only ever neutral - pipes, seams, silos, small cannons.
  const list = neutral ? STRUCTURES.concat(NEUTRAL_STRUCTURES) : STRUCTURES;
  const st = document.getElementById("structures");
  st.innerHTML = "";
  for (const id of list) {
    st.appendChild(cellButton("terrain", id, terrain(id).name,
      id === brushTerrain && tool !== "unit",
      () => { brushTerrain = id; setTool("paint"); }));
  }
  document.getElementById("structhead").textContent =
    neutral ? "Structures — neutral" : "Structures — " + team(brushTeam).name;

  // Units always belong to an army, so neutral offers none.
  const ul = document.getElementById("units");
  ul.innerHTML = "";
  if (!neutral) {
    for (const id of Object.keys(UNITS).map(Number)) {
      ul.appendChild(cellButton("unit", id, UNITS[id],
        id === brushUnit && tool === "unit",
        () => { brushUnit = id; setTool("unit"); }));
    }
  }
  document.getElementById("unitnote").textContent =
    neutral ? "Units belong to an army. Pick one above." : "";

  buildFacing();
  buildTeams();
}

/** A cannon aims somewhere, so offer that only when one is selected. */
function buildFacing() {
  const wrap = document.getElementById("facingwrap");
  const show = DIRECTIONAL.has(brushTerrain) && tool !== "unit";
  wrap.hidden = !show;
  if (!show) return;
  const row = document.getElementById("facing");
  row.innerHTML = "";
  for (const [d, glyph] of [["N", "↑"], ["E", "→"],
                            ["S", "↓"], ["W", "←"]]) {
    const b = document.createElement("button");
    b.className = "teambtn";
    b.textContent = glyph;
    b.title = "Aims " + d;
    b.setAttribute("aria-pressed", String(d === brushFacing));
    b.onclick = () => { brushFacing = d; buildPalette(); };
    row.appendChild(b);
  }
}

function buildTeams() {
  const tl = document.getElementById("teams");
  tl.innerHTML = "";
  const add = (label, colour, value) => {
    const b = document.createElement("button");
    b.className = "teambtn";
    b.style.background = colour;
    b.title = label;
    b.setAttribute("aria-pressed", String(value === brushTeam));
    b.onclick = () => { brushTeam = value; buildPalette(); };
    tl.appendChild(b);
  };
  TEAMS.forEach((t, i) => add(t.name + " (" + (i + 1) + ")", t.color, i));
  add("Neutral (0)", "#b4b4b4", -1);
}

function setTool(t) {
  if (t === "unit" && brushTeam < 0) brushTeam = 0;
  tool = t;
  for (const b of document.querySelectorAll("[data-tool]")) {
    b.setAttribute("aria-pressed", String(b.dataset.tool === t));
  }
  canvas.classList.toggle("pan", t === "pan");
  buildPalette();
}

// --- interaction -----------------------------------------------------------

function tileAt(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left - ox) / size),
    y: Math.floor((e.clientY - r.top - oy) / size),
    lx: e.clientX - r.left,
    ly: e.clientY - r.top,
  };
}

function applyAt(x, y) {
  switch (tool) {
    case "paint": return ed.paint(x, y, brushTerrain, brushTeam, brushFacing);
    case "fill":  return ed.fill(x, y, brushTerrain, brushTeam, brushFacing);
    case "unit":  return ed.placeUnit(x, y, brushUnit, brushTeam);
    case "owner": return ed.setTeam(x, y, brushTeam);
    case "erase": return ed.removeUnit(x, y);
    default:      return false;
  }
}

let drag = null;

// How far the pointer has to move before a right-button press counts as a drag
// rather than a click. Small enough that a deliberate pan starts immediately,
// large enough that clicking with a trackpad does not scroll the map a pixel
// and swallow the delete.
const DRAG_SLOP = 4;

canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);

  // The right button does two things, and which one cannot be known yet:
  // right-drag pans the view, right-click removes the unit under the cursor.
  // So commit to neither here. The pointer either moves far enough to be a
  // drag, or comes up near where it went down, which is a click.
  //
  // An earlier version spent the right button on erasing alone and took
  // right-drag panning away with it. Panning a zoomed map is the more common
  // action by far, so it wins any tie.
  if (e.button === 2) {
    drag = { mode: "right", x: e.clientX, y: e.clientY, ox, oy,
             panning: false, start: tileAt(e) };
    return;
  }

  if (tool === "pan" || e.button === 1 || e.shiftKey) {
    drag = { mode: "pan", x: e.clientX, y: e.clientY, ox, oy };
    canvas.classList.add("panning");
    return;
  }
  const p = tileAt(e);
  drag = { mode: "edit", last: p.x + "," + p.y };
  ed.begin();
  if (applyAt(p.x, p.y)) draw();
});

canvas.addEventListener("pointermove", (e) => {
  const p = tileAt(e);
  if (drag && drag.mode === "pan") {
    ox = drag.ox + (e.clientX - drag.x);
    oy = drag.oy + (e.clientY - drag.y);
    userFramed = true;
    draw();
    return;
  }
  if (drag && drag.mode === "right") {
    // Past the slop, this is a pan and stays one until the button comes up -
    // otherwise a shaky hand turns a deliberate pan back into a delete.
    if (!drag.panning &&
        Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > DRAG_SLOP) {
      drag.panning = true;
      canvas.classList.add("panning");
    }
    if (drag.panning) {
      ox = drag.ox + (e.clientX - drag.x);
      oy = drag.oy + (e.clientY - drag.y);
      userFramed = true;
      draw();
    }
    return;
  }
  // Fill is a single action; dragging it would flood repeatedly.
  if (drag && drag.mode === "edit" && tool !== "fill") {
    const key = p.x + "," + p.y;
    if (key !== drag.last) {
      drag.last = key;
      if (applyAt(p.x, p.y)) draw();
    }
    return;
  }
  if (p.x < 0 || p.y < 0 || p.x >= doc.size.cols || p.y >= doc.size.rows) {
    tip.style.opacity = 0;
    return;
  }
  const cell = cells.get(p.x + "," + p.y);
  const unit = (doc.units || []).find((u) => u.x === p.x && u.y === p.y);
  const bits = [terrain(doc.terrain[p.y][p.x]).name];
  if (cell && cell.team !== undefined && cell.team >= 0) bits.push(team(cell.team).name);
  if (unit) bits.push(UNITS[unit.type] + " (" + team(unit.team).name + ")");
  tip.textContent = "(" + p.x + "," + p.y + ") " + bits.join(" · ");
  tip.style.left = (p.lx + 14) + "px";
  tip.style.top = (p.ly + 14) + "px";
  tip.style.opacity = 1;
});

function endDrag() {
  // A right button that never moved was a click, so do the delete now rather
  // than on the way down.
  if (drag && drag.mode === "right" && !drag.panning) {
    ed.begin();
    if (ed.removeUnit(drag.start.x, drag.start.y)) draw();
    ed.commit();
  }
  if (drag && drag.mode === "edit") ed.commit();
  drag = null;
  canvas.classList.remove("panning");
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("pointerleave", () => { tip.style.opacity = 0; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const next = Math.max(4, Math.min(72, size * (e.deltaY < 0 ? 1.15 : 0.87)));
  ox = mx - (mx - ox) * (next / size);
  oy = my - (my - oy) * (next / size);
  size = next;
  userFramed = true;
  draw();
}, { passive: false });

// --- chrome ----------------------------------------------------------------

for (const b of document.querySelectorAll("[data-tool]")) {
  b.onclick = () => setTool(b.dataset.tool);
}
document.getElementById("undo").onclick = () => ed.undo();
document.getElementById("redo").onclick = () => ed.redo();
document.getElementById("fit").onclick = fit;

document.getElementById("check").onclick = () => {
  const repairs = repairsFor(doc, { MULTI_TILE, STRUCTURE_SPAN });
  if (!repairs.length) return;
  // One at a time, each explained, each its own undo step. A repair that
  // changes how the map plays should not arrive as a surprise.
  const done = [];
  for (const r of repairs) {
    if (!confirm(r.label + "\n\n" + r.detail + "\n\nApply?")) continue;
    ed.begin();
    const n = r.apply(ed);
    ed.commit();
    done.push(r.label + " (" + n + " tiles)");
  }
  if (done.length) {
    refresh();
    alert("Applied:\n  " + done.join("\n  ") +
          "\n\nCtrl+Z takes any of it back.");
  }
};
document.getElementById("name").oninput = (e) => { doc.name = e.target.value; };

// Your name does not change between maps, so remember it. Without this the
// author field is one more thing to retype per map, and what actually happens
// is that nobody fills it in and every map is published by "anonymous".
const AUTHOR_KEY = "awrbc.author";
const authorBox = document.getElementById("author");

function rememberedAuthor() {
  // Private windows and blocked site data make this throw rather than return
  // null, and an editor that will not load is worse than one that forgets.
  try { return localStorage.getItem(AUTHOR_KEY) || ""; } catch { return ""; }
}

authorBox.oninput = (e) => {
  doc.author = e.target.value.trim();
  try { localStorage.setItem(AUTHOR_KEY, doc.author); } catch { /* ignore */ }
};

// Tags are the author's own labels. Anything the map can answer for itself -
// how many armies, whether units are predeployed - is derived at export and
// must not be typed here, or the two can disagree.
const DERIVED_TAGS = new Set(["2-player", "3-player", "4-player",
                              "predeployed", "navy", "fog"]);
document.getElementById("tags").oninput = (e) => {
  const raw = e.target.value.split(",").map((t) => t.trim().toLowerCase());
  doc.tags = [...new Set(raw.filter(Boolean))].sort();
  const claimed = doc.tags.filter((t) => DERIVED_TAGS.has(t));
  document.getElementById("tagnote").textContent = claimed.length
    ? claimed.join(", ") + " is worked out from the map; no need to tag it"
    : "";
};

document.getElementById("resize").onclick = () => {
  const cols = Number(document.getElementById("cols").value);
  const rows = Number(document.getElementById("rows").value);
  if (!Number.isInteger(cols) || !Number.isInteger(rows) || cols < 1 || rows < 1
      || cols > MAX_COLS || rows > MAX_ROWS) {
    alert("Size must be between 1x1 and " + MAX_COLS + "x" + MAX_ROWS + ".");
    refresh();
    return;
  }
  // Shrinking throws away whatever falls outside, so say so before doing it.
  const lost = doc.terrain.reduce((n, row, y) => n + row.reduce((m, t, x) =>
    m + ((x >= cols || y >= rows) && t !== 1 ? 1 : 0), 0), 0)
    + (doc.units || []).filter((u) => u.x >= cols || u.y >= rows).length;
  if (lost && !confirm(
      "Shrinking to " + cols + " x " + rows + " discards " + lost +
      " tile" + (lost === 1 ? "" : "s") + " and anything on them. Continue?")) {
    refresh();
    return;
  }
  if (ed.resize(cols, rows)) fit();
  else refresh();
};

document.getElementById("new").onclick = () => {
  const answer = prompt(
    "Size as COLSxROWS, up to " + MAX_COLS + "x" + MAX_ROWS + ".\n\n" +
    "The in-game editor caps at 30x20. Larger maps play fine but can only " +
    "be edited here.", "30x20");
  if (!answer) return;
  const m = /^\s*(\d+)\s*[x,\s]\s*(\d+)\s*$/i.exec(answer);
  if (!m) { alert("Could not read that size."); return; }
  const cols = Number(m[1]), rows = Number(m[2]);
  // Refuse here rather than let someone build a map the archive will reject.
  if (cols < 1 || rows < 1 || cols > MAX_COLS || rows > MAX_ROWS) {
    alert("Size must be between 1x1 and " + MAX_COLS + "x" + MAX_ROWS + ".");
    return;
  }
  load(emptyMap(cols, rows, "Untitled"));
};

// Opens either half of what Export offers. The editor could write a bundle
// and not read one back, so a map exported that way had no road home.
document.getElementById("file").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = "";               // so the same file can be picked twice
  try {
    const doc = f.name.toLowerCase().endsWith(".zip")
      ? await mapFromBundle(await f.arrayBuffer())
      : JSON.parse(await f.text());
    load(doc);
  } catch (err) {
    alert(`Could not open ${f.name}:

${err.message}`);
  }
};

// Flags are omitted on purpose: `awrbc import` derives them from terrain, so
// the autotile rule stays in one place. See edit.js.
function exportDocument() {
  const out = {
    schema: 1,
    name: doc.name || "Untitled",
    author: doc.author || "anonymous",
    size: doc.size,
    fog: !!doc.fog,
    waterColor: doc.waterColor || 0,
    terrain: doc.terrain,
    cells: doc.cells,
    units: doc.units,
  };
  if (doc.tags && doc.tags.length) out.tags = [...doc.tags].sort();
  if (doc.version && doc.version !== 1) out.version = doc.version;
  return out;
}

function baseName() {
  return (doc.name || "map").replace(/[^\w.-]+/g, "_");
}

function download(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("export").onclick = () => {
  download(new Blob([JSON.stringify(exportDocument(), null, 1)],
                    { type: "application/json" }), baseName() + ".json");
};

// Tile size for the bundled preview. Above the 12px cutoff where tiles fall
// back to letters, and fixed rather than fitted, so every map in the archive is
// drawn at one scale and a big map looks big.
const PREVIEW_TILE = 16;

document.getElementById("bundle").onclick = async () => {
  const out = exportDocument();
  // Rendered with whatever pack is loaded, which is the point: the preview
  // should look like the map looks. The author's local pack is therefore what
  // reaches the archive, deliberately - decision #46, superseding #37.
  const canvas = poster(out, PREVIEW_TILE);
  const png = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));

  download(zip({
    "map.json": JSON.stringify(out, null, 1),
    "preview.png": await png.arrayBuffer(),
  }), baseName() + ".zip");
};

// Submitting to the archive. The wiring lives in submit-ui.js; this hands it
// what it needs and nothing more, so it ports to the framework app unchanged.
attachSubmit({
  // ?intake= wins (for development), then whatever the deploy wrote
  // into the meta tag. No fallback to localhost: a hosted editor that
  // quietly pointed at 127.0.0.1 would look broken for everyone.
  base: intakeBase(location.search,
                   document.querySelector('meta[name="awrbc-intake"]')
                     ?.content?.trim() || ""),
  button: document.getElementById("submit"),
  label: document.getElementById("who"),
  signOut: document.getElementById("signout"),
  currentDoc: exportDocument,
  stats,
  async bundle() {
    const out = exportDocument();
    const canvas = poster(out, PREVIEW_TILE);
    const png = await new Promise((r) => canvas.toBlob(r, "image/png"));
    return zip({
      "map.json": JSON.stringify(out, null, 1),
      "preview.png": await png.arrayBuffer(),
    });
  },
});

// The save panel, in the desktop app only. In a browser this resolves false
// and nothing appears - the hosted build has no bridge and no way to reach a
// file (decision #52).
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") {
    e.preventDefault();
    if (e.shiftKey) ed.redo(); else ed.undo();
  } else if ((e.ctrlKey || e.metaKey) && k === "y") {
    e.preventDefault();
    ed.redo();
  } else if (k === "b") setTool("paint");
  else if (k === "g") setTool("fill");
  else if (k === "u") setTool("unit");
  else if (k === "o") setTool("owner");
  else if (k === "e") setTool("erase");
  else if (k === "h") setTool("pan");
  else if (k >= "1" && k <= "5") { brushTeam = Number(k) - 1; buildPalette(); }
  else if (k === "0") { brushTeam = -1; buildPalette(); }
});

window.addEventListener("resize", resize);
// The canvas can settle to its real size after first paint - fonts, scrollbars,
// the pane being dragged - and a window listener alone misses that, leaving the
// map fitted to a size it no longer has.
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
setTool("paint");
resize();
load(doc);

const packReady = loadPack().then((ok) => {
  if (ok) {
    const tag = document.getElementById("pack");
    tag.textContent = "sprites: " + packLabel();
    tag.hidden = false;
  }
  buildPalette();
  draw();
});

const wanted = new URLSearchParams(location.search).get("map");
if (wanted) {
  packReady
    .then(() => fetch(wanted))
    .then((r) => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
    .then(load)
    .catch((e) => {
      document.getElementById("why").textContent = "Could not load: " + e.message;
    });
}
</script>
</body>
</html>
